# Publishes the pantry-app folder to GitHub Pages every time it changes on main.
name: Deploy pantry app

on:
  push:
    branches: [main]
    paths:
      - 'pantry-app/**'
      - '.github/workflows/deploy-pantry-app.yml'
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pantry-app
      - id: deployment
        uses: actions/deploy-pages@v4
